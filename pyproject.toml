[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-wav-transcriber"
version = "0.1.0"
description = "Batch-transcribe .wav files to text using a Gemma model running locally in Ollama."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lllaury" }]
requires-python = ">=3.12"
dependencies = ["numpy>=2.1"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[project.scripts]
gemma-transcribe = "gemma_wav_transcriber.cli:main"

[project.urls]
Homepage = "https://github.com/lllaury/gemma-wav-transcriber"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: Test and build executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install
        run: python -m pip install ".[dev,build]"

      - name: Test
        run: python -m pytest -q

      - name: Build executable
        run: >
          pyinstaller --onefile --name gemma-transcribe-${{ runner.os }}
          --collect-submodules gemma_wav_transcriber
          src/gemma_wav_transcriber/__main__.py

      - name: Smoke test executable
        shell: bash
        run: ./dist/gemma-transcribe-${{ runner.os }}* --version

      - uses: actions/upload-artifact@v4
        with:
          name: gemma-transcribe-${{ runner.os }}
          path: dist/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

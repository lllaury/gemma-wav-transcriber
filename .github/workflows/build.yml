name: Test and build executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to create and publish as a release (e.g. v0.3.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install
        run: python -m pip install ".[dev,build]"

      - name: Test
        run: python -m pytest -q

      - name: Build executable
        run: >
          pyinstaller --onefile --name gemma-transcribe-${{ runner.os }}
          --collect-submodules gemma_wav_transcriber
          src/gemma_wav_transcriber/__main__.py

      - name: Smoke test executable
        shell: bash
        run: ./dist/gemma-transcribe-${{ runner.os }}* --version

      - uses: actions/upload-artifact@v4
        with:
          name: gemma-transcribe-${{ runner.os }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_tag || github.ref_name }}
          body: |
            Standalone executables for Windows, macOS and Linux. No Python install needed; Ollama with a Gemma model must be running.
            On macOS/Linux, run `chmod +x` on the file after downloading.
          files: dist/*
